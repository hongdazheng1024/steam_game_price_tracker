# Settings for steam_price_db_init.py.

# true drops every table before recreating them, deleting all cached prices, price history and
# title-to-id mappings. Use it after changing a table schema; set it back to false afterwards.
force_to_drop_tables = false

# A game's price history is refetched (only the changes since the last fetch) once it's older than this.
history_max_age_hours = 24

# A game's details (release date, publishers, reviews, player counts) are refetched once older than this.
game_info_max_age_hours = 168
