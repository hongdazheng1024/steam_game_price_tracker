[project]
name = "steam-game-price-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "gradio>=6.29.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.3",
    "markdownify>=1.2.3",
    "ollama>=0.6.2",
    "openai>=3.24.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
]

# Kept small on purpose: the tests need none of the ML stack, so CI installs only this group.
[dependency-groups]
dev = [
    "httpx",
    "langchain-core>=1.6.6",
    "langchain-text-splitters>=1.1.3",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# RAG/ is on the path because data_load.py runs as a script and imports chunking directly.
pythonpath = [".", "RAG"]

# Same extra path for the editor (Pylance/Pyright), so `import chunking` resolves in tests/.
[tool.pyright]
extraPaths = ["RAG"]
