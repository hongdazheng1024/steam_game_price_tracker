name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # Only the dev group: the tests don't need torch, Chroma or the embedding model.
      - name: Run tests
        run: uv run --only-group dev pytest -v
